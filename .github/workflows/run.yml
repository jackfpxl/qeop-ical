name: TEA NextGen Bot

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Which task to run"
        required: true
        type: choice
        default: export_members
        options:
          - export_members
          - scrape_events
          # Add new options here as you add new tasks/*.py files

permissions:
  contents: write  # needed so scrape_events can commit data/bot_state.json back

concurrency:
  group: tea-nextgen-bot-event-state
  cancel-in-progress: false

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run task
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python3 main.py --task "${{ inputs.task }}"

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tea-nextgen-bot-output-${{ inputs.task }}
          path: output/
          retention-days: 7
          if-no-files-found: warn

      - name: Commit updated state (scrape_events only)
        if: inputs.task == 'scrape_events'
        run: |
          git config user.name "TEA NextGen Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bot_state.json
          git diff --cached --quiet || git commit -m "Update event tracking state [skip ci]"
          git push
