name: Sync Discord Events (backfill missing)

on:
  workflow_dispatch: {}

permissions:
  contents: write  # needed to commit data/bot_state.json back

concurrency:
  group: tea-nextgen-bot-event-state
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python3 main.py --task sync_discord_events

      - name: Commit updated state
        run: |
          git config user.name "TEA NextGen Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bot_state.json
          git diff --cached --quiet || git commit -m "Sync Discord Event tracking state [skip ci]"
          git push
