name: Update QEOP traffic calendar

on:
  schedule:
    # 06:00 UTC every Monday. GitHub's scheduler can run a little late at
    # busy times, but this comfortably satisfies "at least every week" -
    # see README for how to tighten this if you want more frequent checks.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # lets you trigger a manual refresh from the Actions tab
  push:
    branches: [main]
    paths:
      - generate_ics.py
      - requirements.txt

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate ICS
        run: python generate_ics.py

      - name: Commit updated calendar
        run: |
          git config user.name "qeop-traffic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/qeop-traffic.ics docs/history_archive.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-update QEOP traffic calendar"
          git push
